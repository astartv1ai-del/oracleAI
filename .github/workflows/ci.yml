name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Frontend build required by API tests
        run: |
          npm ci --ignore-scripts
          npm run build:frontend
          python scripts/check_frontend_build.py
          python scripts/check_static_asset_references.py

      - name: Системные библиотеки WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev sqlite3

      - name: Зависимости (закреплённые версии)
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check app scripts tests

      - name: Python syntax/import smoke
        run: python -m compileall -q app scripts tests

      - name: JavaScript syntax
        shell: bash
        run: |
          find miniapp/js admin -type f -name '*.js' -print0 \
            | xargs -0 -r -n1 node --check

      - name: Repository hygiene
        run: python scripts/check_repository_hygiene.py

      - name: Documentation links
        run: python scripts/check_documentation_links.py

      - name: Standalone quality script smoke
        run: |
          python scripts/validate_skill_library.py
          python scripts/check_agent_stability.py
          python scripts/benchmark_vedic_routing.py >/tmp/vedic-routing.json
          python scripts/benchmark_mira_lenormand.py >/tmp/mira-lenormand.json

      - name: Cache-busting policy
        run: python scripts/check_cache_busting.py

      - name: Design contract
        run: python scripts/check_design_contract.py

      - name: LLM golden-set evaluator smoke
        run: |
          mkdir -p artifacts
          python scripts/generate_eval_set.py
          python scripts/evaluate_llm.py \
            --cases data/llm_eval/golden_cases.jsonl \
            --responses data/llm_eval/sample_responses.jsonl \
            --out artifacts/llm-eval-report.json \
            --min-score 0.75

      - name: Migration-focused tests
        run: python -m pytest tests/test_migrations.py tests/test_data.py -q -p no:cacheprovider --timeout=120

      - name: Full tests
        run: python -m pytest tests/ -q -p no:cacheprovider --timeout=120

      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt

      - name: Selfcheck
        run: python scripts/selfcheck.py

      - name: Production-readiness static gate
        run: python scripts/release_gate.py

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: artifacts/llm-eval-report.json
          if-no-files-found: ignore

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Системные библиотеки API и Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            chromium \
            libcairo2 libpango-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev sqlite3

      - name: Python-зависимости для QA-сервера
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build and validate frontend
        run: |
          npm run build:frontend
          python scripts/check_frontend_build.py
          python scripts/check_static_asset_references.py

      - name: JavaScript syntax
        shell: bash
        run: |
          find miniapp/js admin scripts -type f -name '*.js' -print0 \
            | xargs -0 -r -n1 node --check

      - name: Seed isolated QA user and start server
        env:
          QA_DB: ${{ runner.temp }}/oracleai-qa.db
        run: |
          python scripts/seed_visual_user.py --db "$QA_DB"
          APP_ENV=dev DEV_MODE=1 BUNDLE_ASSETS=1 DB_PATH="$QA_DB" \
            nohup python -m uvicorn app.api.main:app --host 127.0.0.1 --port 8080 \
            >"${RUNNER_TEMP}/oracleai-api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null && exit 0
            sleep 1
          done
          cat "${RUNNER_TEMP}/oracleai-api.log"
          exit 1

      - name: Full SPA axe and Lighthouse matrix
        env:
          LH_CATEGORIES: performance,accessibility,best-practices,seo
        run: |
          QA_OUT_DIR=ci-axe npm run test:axe
          QA_OUT_DIR=ci-lighthouse-axe npm run test:lighthouse

      - name: Upload frontend audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-${{ github.sha }}
          path: |
            artifacts/ci-axe/
            artifacts/ci-lighthouse-axe/
            ${{ runner.temp }}/oracleai-api.log
          if-no-files-found: warn
