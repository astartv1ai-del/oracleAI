name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Системные библиотеки WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2 libpango-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev

      - name: Зависимости (закреплённые версии)
        run: pip install -r requirements-dev.txt

      - name: Тесты
        run: python -m pytest tests/ -q -p no:cacheprovider --timeout=120

      - name: Самопроверка
        run: python scripts/selfcheck.py
